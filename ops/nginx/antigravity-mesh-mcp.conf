    # --- Antigravity Mesh FastMCP Gateway Endpoints ---
    # --- Scanner / secret-hunting noise control ---
    # Automated probes for .env, secrets, backups and WordPress files always
    # 404. Answer them here so they never reach the app or its logs.
    location ~* \.(env|git|svn|bak|old|sql|log|ini|conf|yml|yaml|json)$ {
        access_log off;
        return 404;
    }
    location ~* /(wp-content|wp-admin|wp-config|vendor|node_modules)/ {
        access_log off;
        return 404;
    }

    # --- Served bootstrap files -------------------------------------------
    # "default_type text/plain", never "add_header Content-Type ...": add_header
    # APPENDS a header, and `alias` has already set Content-Type by extension, so
    # the response carried TWO Content-Type values
    # ("application/octet-stream" then "text/plain; charset=utf-8"). A client that
    # honours the first one treats the script as binary: PowerShell's
    # Invoke-WebRequest then hands Invoke-Expression a byte array instead of text,
    # and the documented `irm .../install.ps1 | iex` cannot work.
    location /install.sh {
        alias /var/www/antigravity-mesh/install.sh;
        default_type text/plain;
        charset utf-8;
        add_header Access-Control-Allow-Origin *;
    }

    location /install.ps1 {
        alias /var/www/antigravity-mesh/install.ps1;
        default_type text/plain;
        charset utf-8;
        add_header Access-Control-Allow-Origin *;
    }

    location = /gateway.py {
        # Source is published in the GitHub repository; the live gateway does not
        # need to serve it. Keeps the auth/tunnel logic off the public surface.
        access_log off;
        return 404;
    }

    # --- Only the bootstrap files are public -------------------------------
    # A curl/npx install needs exactly these; the rest of core/ (hooks, policies,
    # schemas, subagents, triggers, code_cache, agent_harness) is internal and is
    # not fetched by any installer, so it is not served.
    location ~ ^/core/(hooks|policies|schemas|subagents|triggers|code_cache|agent_harness)\.py$ {
        access_log off;
        return 404;
    }

    location /core/ {
        alias /var/www/antigravity-mesh/core/;
        default_type text/plain;
        charset utf-8;
        add_header Access-Control-Allow-Origin *;
    }

    location /skills/ {
        alias /var/www/antigravity-mesh/skills/;
        default_type text/plain;
        charset utf-8;
        add_header Access-Control-Allow-Origin *;
    }

    location /mcp {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        keepalive_timeout 0;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Target-User "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /sse {
        proxy_pass http://127.0.0.1:8096/sse;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        keepalive_timeout 0;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Target-User "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /messages {
        proxy_pass http://127.0.0.1:8096/messages;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        keepalive_timeout 0;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Target-User "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /ws/tunnel {
        proxy_pass http://127.0.0.1:8096/ws/tunnel;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Target-User "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/register {
        limit_req zone=mesh_register burst=5 nodelay;
        proxy_pass http://127.0.0.1:8096/api/register;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Target-User "";
    }

    location /health-mesh {
        proxy_pass http://127.0.0.1:8096/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Target-User "";
    }

    location = /.well-known/oauth-protected-resource {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /.well-known/oauth-protected-resource/ {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
